[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-automation-env"
version = "1.0.0"
description = "OpenEnv-compatible SRE automation environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rutul Patel" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "server*"]
