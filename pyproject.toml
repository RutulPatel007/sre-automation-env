[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-automation-env"
version = "1.0.0"
description = "OpenEnv-compatible SRE automation environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rutul Patel" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "openai>=1.25.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "server*"]
